server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 护照照片 / 收款截图以 base64 内联进 JSON（多人/大图时可达数 MB）。
    # nginx 默认 client_max_body_size 仅 1MB，会先于后端（25MB）以 413 拒掉。
    # 设 30MB：与后台一致，留足上传余量，最终由后端做上限把关。
    client_max_body_size 30m;

    # 静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html 不缓存：发版后用户立刻拿到新资源清单（否则浏览器启发式缓存旧页）
    # 注意 add_header 在 location 内会覆盖 server 级继承，安全头需在此重申
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头
    # SAMEORIGIN（非 DENY）：允许同源 iframe —— ?preview=mobile 小程序手机壳预览要内嵌自己
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # /api 反代（由 docker-compose 服务名路由到 backend）
    location /api/ {
        proxy_pass http://backend:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
