<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e8aa0" />

    <!-- 默认 SEO（详情页等会用 react-helmet-async 覆盖 title/description/og:*/canonical） -->
    <title>椰岛假期 · 澳门⇌越南海岛专线</title>
    <meta
      name="description"
      content="椰岛假期 · 澳门⇌越南海岛专线：套餐 / 机票 / 酒店 / 接送 / 签证一站式预订，一价全包，省心出行。"
    />
    <link rel="canonical" href="https://store.citurtravel.com/" />

    <!-- Open Graph 默认值 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Coco Holiday" />
    <meta property="og:title" content="椰岛假期 · 澳门⇌越南海岛专线" />
    <meta
      property="og:description"
      content="套餐 / 机票 / 酒店 / 接送 / 签证一站式预订，一价全包，省心出行。"
    />
    <meta property="og:image" content="https://store.citurtravel.com/favicon.svg" />
    <meta property="og:url" content="https://store.citurtravel.com/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Manrope = 正文 + 中文标题字重；Fraunces（可变衬线，opsz 轴）= 仅 Latin 展示位
         （kicker 英文、Coco Holiday 罗马字、¥/时长/日期等大数字、英文副标题）。
         Fraunces 不渲染中文 —— 中文标题靠字重/字号/字距出气质。 -->
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-canvasWarm text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
