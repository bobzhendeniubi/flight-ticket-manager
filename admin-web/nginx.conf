server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 护照 OCR 录单会把每位出行人的护照照片以 base64 内联进 JSON（多人时可达数 MB）。
    # nginx 默认 client_max_body_size 仅 1MB，会先于后端（25MB）以 413 拒掉，表现为"录单失败"。
    # 设 30MB：留足多人护照照片 + 收款截图，且仍低于后端上限由后端做最终把关。
    client_max_body_size 30m;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html 不缓存：发版后用户立刻拿到新资源清单（注意 add_header 继承覆盖，安全头重申）。
    # 两个入口都要显式覆盖——直接请求 /index.html 走这条；请求根路径 / 时虽然 try_files 内部
    # 重定向到 /index.html 也会命中这条（nginx 内部重定向会重新走 location 匹配），但这里额外加
    # 一条 exact-match 的 `location = /`，不依赖内部重定向语义，两条路径都直接、显式拿到 no-cache。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location = / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        try_files /index.html =404;
    }

    # 其余 SPA 路由（如 /orders/123）：命中不到真实文件 → 回落 /index.html（上面那条 no-cache 头生效）；
    # 哈希后的 /assets/*.js|css 走最上面的扩展名正则长缓存，不受这里影响。
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /api/ {
        proxy_pass http://backend:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
