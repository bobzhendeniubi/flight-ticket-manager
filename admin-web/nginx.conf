server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 护照 OCR 录单会把每位出行人的护照照片以 base64 内联进 JSON（多人时可达数 MB）。
    # nginx 默认 client_max_body_size 仅 1MB，会先于后端（25MB）以 413 拒掉，表现为"录单失败"。
    # 设 30MB：留足多人护照照片 + 收款截图，且仍低于后端上限由后端做最终把关。
    client_max_body_size 30m;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html 不缓存：发版后用户立刻拿到新资源清单（注意 add_header 继承覆盖，安全头重申）
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /api/ {
        proxy_pass http://backend:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
